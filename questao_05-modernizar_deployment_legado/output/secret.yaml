# ATENÇÃO: Nunca versione este arquivo com valores reais.
# Gere os valores com: echo -n 'valor' | base64
# Em pipelines CI/CD, injete os valores via vault (HashiCorp Vault, AWS Secrets Manager, etc.)
#
# Exemplo para gerar os valores base64:
#   echo -n 'SuaS3nh@Aqui' | base64
#   echo -n 'seu-jwt-secret-aqui' | base64

apiVersion: v1
kind: Secret
metadata:
  name: chronos-api-secrets
  namespace: production
  labels:
    app: chronos-api
    managed-by: kubectl
type: Opaque
data:
  # Substitua pelos valores reais codificados em base64 ANTES de aplicar
  db-password: REPLACE_WITH_BASE64_ENCODED_DB_PASSWORD
  jwt-secret: REPLACE_WITH_BASE64_ENCODED_JWT_SECRET
