apiVersion: apps/v1
kind: Deployment
metadata:
  name: chronos-api
  namespace: production
  labels:
    app: chronos-api
    version: "1.0.0"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chronos-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime: sobe 1 novo antes de derrubar qualquer pod
  template:
    metadata:
      labels:
        app: chronos-api
        version: "1.0.0"
    spec:
      # Impede que containers rodem como root
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Garante que pods sejam distribuídos entre nós diferentes
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: chronos-api
      containers:
      - name: api
        image: chronos-api:1.0.0    # imagem versionada — nunca usar :latest em produção
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: chronos-api-secrets
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: chronos-api-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /healthz      # ajuste para o endpoint real da aplicação
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready        # ajuste para o endpoint real da aplicação
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        # Se a aplicação precisar escrever em disco (logs, tmp), monte volumes explícitos:
        # volumeMounts:
        # - name: tmp
        #   mountPath: /tmp
      # volumes:
      # - name: tmp
      #   emptyDir: {}